name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Package extension
        run: npx vsce package --allow-missing-repository --out cat-stopper-${{ github.ref_name }}.vsix

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: cat-stopper-*.vsix
          generate_release_notes: true
